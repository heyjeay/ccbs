name: Release

# Push a tag like v0.2.0 (or run this workflow by hand with a tag name) to
# build binaries for every platform and publish them, plus checksums.txt
# which the installers verify, as a GitHub Release. Run by hand, a tag that
# doesn't exist yet is created at the commit the workflow runs on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0 (created from the chosen branch if new)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=build/${os}_${arch}; mkdir -p "$out"
            bin=ccbs; [ "$os" = windows ] && bin=ccbs.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" -o "$out/$bin" .
            cp README.md LICENSE "$out/"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q "../../dist/ccbs_${os}_${arch}.zip" *)
            else
              tar -C "$out" -czf "dist/ccbs_${os}_${arch}.tar.gz" .
            fi
          done
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ccbs $TAG" --generate-notes
          fi
